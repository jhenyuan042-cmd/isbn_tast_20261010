<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ISBN 批次掃描器</title>
  <link rel="stylesheet" href="style.css">
  <!-- 條碼辨識核心庫 -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <div class="container">
    <!-- 頂端列 -->
    <header>
      <h1>📚 ISBN 批次掃描器</h1>
      <button id="btn-export" class="btn btn-green" disabled>📥 匯出 CSV</button>
    </header>

    <!-- 相機掃描區 -->
    <section class="card camera-card">
      <div id="reader"></div>
      <div id="cam-overlay" class="cam-overlay">
        <p id="cam-tip">相機未啟動</p>
        <button id="btn-toggle-cam" class="btn btn-primary">📷 啟動相機</button>
      </div>
    </section>

    <!-- 手動輸入區 -->
    <section class="manual-bar">
      <input type="text" id="manual-isbn" placeholder="手動輸入 ISBN (例如 9789861755267)" maxlength="20">
      <button id="btn-manual-add" class="btn btn-primary">查詢並加入</button>
    </section>

    <!-- 訊息提示條 -->
    <div id="toast" class="toast"></div>

    <!-- 掃描結果清單 -->
    <section class="list-section">
      <div class="list-header">
        <h2>已掃描書籍 (<span id="book-count">0</span> 本)</h2>
        <button id="btn-clear" class="btn btn-danger btn-sm" disabled>清空清單</button>
      </div>
      <div id="book-list" class="book-list">
        <div id="empty-hint" class="empty-hint">尚未掃描任何書籍</div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
