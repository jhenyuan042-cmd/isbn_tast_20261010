<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ISBN 核心功能測試台 (Camera + API + Terminal)</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- html5-qrcode -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #06b6d4;
      --radius: 12px;
      --font-mono: 'Fira Code', monospace, Consolas;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans TC', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0.75rem;
      gap: 0.75rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.25rem;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #fff;
    }

    .badge-test {
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid var(--primary);
      color: #a5b4fc;
      border-radius: 999px;
    }

    /* 三欄排版配置 */
    .dashboard {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      flex: 1;
    }

    @media (min-width: 1024px) {
      .dashboard {
        display: grid;
        grid-template-columns: 1fr 1fr 1.2fr;
        height: calc(100vh - 80px);
        overflow: hidden;
      }
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .panel-header {
      padding: 0.65rem 0.9rem;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-title {
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .panel-body {
      padding: 0.85rem;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    /* 1. 相機欄位 */
    .camera-box {
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #reader {
      width: 100% !important;
      height: 100% !important;
    }
    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    .camera-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: var(--text-dim);
      background: #050811;
      z-index: 5;
    }

    .camera-placeholder.hidden {
      display: none;
    }

    .scan-reticle {
      position: absolute;
      width: 80%;
      height: 40%;
      border: 2px dashed rgba(34, 197, 94, 0.7);
      border-radius: 6px;
      pointer-events: none;
      z-index: 6;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35);
    }

    .controls-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.55rem 0.9rem;
      border-radius: 8px;
      border: 1px solid transparent;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }
    .btn-ghost { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border-color: var(--card-border); }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .btn-sm { padding: 0.35rem 0.6rem; font-size: 0.75rem; }

    .test-inputs {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .test-inputs label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }
    .input-row {
      display: flex;
      gap: 0.4rem;
    }
    .input-row input {
      flex: 1;
      background: #070a13;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 0.45rem 0.65rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-family: var(--font-mono);
    }
    .input-row input:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* 2. 書籍資訊欄位 */
    .book-display {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .book-hero {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
    }

    .book-thumb {
      width: 80px;
      height: 110px;
      background: #070a13;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      color: var(--text-dim);
    }
    .book-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .book-main-info {
      flex: 1;
      min-width: 0;
    }
    .book-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.35;
      color: #fff;
      word-break: break-word;
    }
    .book-isbn-tag {
      display: inline-block;
      margin-top: 0.35rem;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      padding: 0.15rem 0.45rem;
      background: rgba(6, 182, 212, 0.15);
      color: var(--info);
      border-radius: 4px;
    }

    .info-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .info-table td {
      padding: 0.4rem 0.2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .info-table td:first-child {
      color: var(--text-dim);
      width: 75px;
    }
    .info-table td:last-child {
      color: var(--text);
    }

    .json-details {
      background: #070a13;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      overflow: hidden;
    }
    .json-details summary {
      padding: 0.45rem 0.65rem;
      font-size: 0.78rem;
      cursor: pointer;
      color: var(--text-muted);
      user-select: none;
    }
    .json-details pre {
      padding: 0.65rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: #a5b4fc;
      max-height: 180px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* 3. Terminal 欄位 */
    .terminal-body {
      background: #05070e;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      line-height: 1.5;
      padding: 0.65rem;
      border-radius: 6px;
      flex: 1;
      overflow-y: auto;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .log-entry {
      word-break: break-all;
      white-space: pre-wrap;
    }
    .log-time { color: var(--text-dim); }
    .log-info { color: #38bdf8; }
    .log-success { color: #4ade80; }
    .log-warn { color: #fbbf24; }
    .log-error { color: #f87171; font-weight: 600; }
    .log-data { color: #c084fc; }

    .empty-placeholder {
      margin: auto;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.85rem;
      padding: 2rem 1rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>
      <i data-lucide="scan-line" style="color: var(--primary);"></i>
      ISBN 核心測試台
    </h1>
    <span class="badge-test">Google Books API 驗證版</span>
  </header>

  <div class="dashboard">

    <!-- 欄位 1: 相機掃描 -->
    <section class="panel">
      <div class="panel-header">
        <span class="panel-title"><i data-lucide="camera"></i> 1. 相機掃描</span>
        <span id="cam-status" style="font-size:0.75rem; color:var(--text-dim);">閒置</span>
      </div>
      <div class="panel-body">
        <div class="camera-box">
          <div id="reader"></div>
          <div id="cam-placeholder" class="camera-placeholder">
            <i data-lucide="video-off" style="width: 32px; height: 32px;"></i>
            <span>相機尚未啟動</span>
          </div>
          <div class="scan-reticle"></div>
        </div>

        <div class="controls-row">
          <button id="btn-start" class="btn btn-primary">
            <i data-lucide="play"></i> 啟動相機
          </button>
          <button id="btn-stop" class="btn btn-danger" style="display:none;">
            <i data-lucide="square"></i> 關閉相機
          </button>
          <button id="btn-torch" class="btn btn-ghost" disabled>
            <i data-lucide="flashlight"></i> 補光燈
          </button>
        </div>

        <!-- 獨立手動輸入 ISBN 測試區 -->
        <div class="test-inputs">
          <label>手動 ISBN 測試（不需鏡頭直接測 API）：</label>
          <div class="input-row">
            <input type="text" id="input-test-isbn" placeholder="例如: 9789861755267" value="9789861755267">
            <button id="btn-test-isbn" class="btn btn-ghost">
              <i data-lucide="send"></i> 查詢
            </button>
          </div>
          
          <label style="margin-top:0.35rem;">自訂 Google Books API Key（留空則無金鑰）：</label>
          <div class="input-row">
            <input type="text" id="input-api-key" placeholder="AIzaSy... (選填)">
            <button id="btn-save-key" class="btn btn-sm btn-ghost">保存</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 欄位 2: 書籍資訊 -->
    <section class="panel">
      <div class="panel-header">
        <span class="panel-title"><i data-lucide="book-open"></i> 2. 書籍資訊</span>
        <button id="btn-clear-book" class="btn btn-sm btn-ghost">清空</button>
      </div>
      <div class="panel-body" id="book-panel-body">
        <div id="book-empty" class="empty-placeholder">
          尚未取得任何書籍資訊<br>請透過左側掃描或直接點擊查詢
        </div>

        <div id="book-content" class="book-display" style="display:none;">
          <div class="book-hero">
            <div class="book-thumb" id="b-thumb">
              <i data-lucide="book"></i>
            </div>
            <div class="book-main-info">
              <h2 class="book-title" id="b-title">書名</h2>
              <span class="book-isbn-tag" id="b-isbn">ISBN: -</span>
            </div>
          </div>

          <table class="info-table">
            <tbody>
              <tr><td>作者</td><td id="b-author">-</td></tr>
              <tr><td>出版社</td><td id="b-publisher">-</td></tr>
              <tr><td>出版日期</td><td id="b-date">-</td></tr>
              <tr><td>頁數</td><td id="b-pages">-</td></tr>
              <tr><td>分類</td><td id="b-categories">-</td></tr>
            </tbody>
          </table>

          <details class="json-details">
            <summary>檢視 Google Books 原始 JSON 回傳</summary>
            <pre id="b-raw-json">{}</pre>
          </details>
        </div>
      </div>
    </section>

    <!-- 欄位 3: Terminal 回傳資訊 -->
    <section class="panel">
      <div class="panel-header">
        <span class="panel-title"><i data-lucide="terminal"></i> 3. Terminal 回傳紀錄</span>
        <div style="display:flex; gap:0.35rem;">
          <button id="btn-copy-log" class="btn btn-sm btn-ghost" title="複製 Log">複製</button>
          <button id="btn-clear-log" class="btn btn-sm btn-ghost" title="清空 Log">清空</button>
        </div>
      </div>
      <div class="panel-body" style="padding:0.5rem;">
        <div class="terminal-body" id="terminal">
          <!-- Log 訊息動態寫入處 -->
        </div>
      </div>
    </section>

  </div>

  <script>
    (function() {
      // 狀態變數
      let html5QrCode = null;
      let isScanning = false;
      let isTorchOn = false;
      let lastScannedCode = '';
      let scanCooldown = false;

      // DOM 快取
      const t = document.getElementById('terminal');
      const camStatus = document.getElementById('cam-status');
      const camPlaceholder = document.getElementById('cam-placeholder');
      const btnStart = document.getElementById('btn-start');
      const btnStop = document.getElementById('btn-stop');
      const btnTorch = document.getElementById('btn-torch');
      const inputTestIsbn = document.getElementById('input-test-isbn');
      const btnTestIsbn = document.getElementById('btn-test-isbn');
      const inputApiKey = document.getElementById('input-api-key');
      const btnSaveKey = document.getElementById('btn-save-key');

      const bookEmpty = document.getElementById('book-empty');
      const bookContent = document.getElementById('book-content');
      const bTitle = document.getElementById('b-title');
      const bIsbn = document.getElementById('b-isbn');
      const bAuthor = document.getElementById('b-author');
      const bPublisher = document.getElementById('b-publisher');
      const bDate = document.getElementById('b-date');
      const bPages = document.getElementById('b-pages');
      const bCategories = document.getElementById('b-categories');
      const bThumb = document.getElementById('b-thumb');
      const bRawJson = document.getElementById('b-raw-json');
      const btnClearBook = document.getElementById('btn-clear-book');

      // 初始化 API Key
      inputApiKey.value = localStorage.getItem('google_books_api_key') || '';

      // Terminal 紀錄函式
      function log(msg, type = 'info') {
        const time = new Date().toLocaleTimeString('zh-TW', { hour12: false, fractionalSecondDigits: 3 });
        const line = document.createElement('div');
        line.className = `log-entry log-${type}`;
        line.innerHTML = `<span class="log-time">[${time}]</span> ${escapeHtml(msg)}`;
        t.appendChild(line);
        t.scrollTop = t.scrollHeight;
      }

      function escapeHtml(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      log('核心測試台就緒。請啟動相機或使用手動測試。', 'info');

      // API 查詢核心
      async function queryGoogleBooks(isbn) {
        const clean = isbn.replace(/[^0-9Xx]/g, '').trim();
        if (!clean) {
          log('ISBN 格式無效 (空值)', 'warn');
          return;
        }

        const apiKey = localStorage.getItem('google_books_api_key') || '';
        log(`----------------------------------------`, 'info');
        log(`[查詢開始] 目標 ISBN: ${clean}`, 'info');

        // 查詢輔助器
        async function fetchEndpoint(queryStr, useKey) {
          let url = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(queryStr)}`;
          if (useKey && apiKey) {
            url += `&key=${encodeURIComponent(apiKey)}`;
          }

          log(`[HTTP GET] 發送請求: ${url.replace(apiKey, apiKey.substring(0, 6) + '***')}`, 'info');
          const t0 = performance.now();

          const res = await fetch(url);
          const t1 = performance.now();
          const latency = Math.round(t1 - t0);

          log(`[HTTP 回應] 狀態碼: ${res.status} ${res.statusText} (耗時: ${latency}ms)`, res.ok ? 'success' : 'error');

          if (!res.ok) {
            let errorDetail = '';
            try {
              const errBody = await res.json();
              errorDetail = JSON.stringify(errBody, null, 2);
              log(`[API 報錯細節]:\n${errorDetail}`, 'error');
            } catch(e) {
              const text = await res.text();
              log(`[API 報錯文字]: ${text}`, 'error');
            }

            // 處理 400 (API Key 無效) 或 403 (權限/網址被拒)
            if (res.status === 400 || res.status === 403) {
              if (res.status === 400) {
                log(`[警告 400] 填入的 API 金鑰無效 (API_KEY_INVALID)！`, 'warn');
              } else {
                log(`[警告 403] 常見原因：1. GCP 金鑰限制了 HTTP 參照網址 (Referrer)。2. 未啟用 Books API。`, 'warn');
              }
              if (useKey && apiKey) {
                log(`[自動救濟] 金鑰驗證失敗，立即轉為「免金鑰公開配額模式」重新查詢...`, 'warn');
                return await fetchEndpoint(queryStr, false);
              }
            } else if (res.status === 429) {
              log(`[警告 429] 請求過度頻繁 (Too Many Requests)，請稍後再試。`, 'warn');
            }
            throw new Error(`HTTP ${res.status}`);
          }

          const data = await res.json();
          return data;
        }

        try {
          // 步驟 1: 直接使用純碼全文檢索 q=xxx（速度最快、省去一次請求，且對繁體中文書涵蓋率最高）
          let result = await fetchEndpoint(clean, true);
          log(`[結果分析] q=${clean} 傳回 totalItems: ${result?.totalItems || 0}`, result?.totalItems > 0 ? 'success' : 'warn');

          // 步驟 2: 若極少數情況查無資料，才備用嘗試 q=isbn:xxx
          if (!result || result.totalItems === 0 || !result.items || result.items.length === 0) {
            log(`[備用檢索] q=${clean} 查無結果，嘗試使用 q=isbn:${clean}...`, 'warn');
            result = await fetchEndpoint(`isbn:${clean}`, true);
            log(`[備用分析] q=isbn:${clean} 傳回 totalItems: ${result?.totalItems || 0}`, result?.totalItems > 0 ? 'success' : 'warn');
          }

          if (result && result.totalItems > 0 && result.items && result.items.length > 0) {
            const item = result.items[0];
            const info = item.volumeInfo || {};
            log(`[成功取得書籍] 《${info.title || '無標題'}》`, 'success');
            renderBook(clean, info, result);
          } else {
            log(`[查無收錄] Google Books 資料庫未收錄此 ISBN: ${clean}`, 'warn');
            renderEmptyBook(clean, result);
          }

        } catch (err) {
          log(`[查詢終止] 發生異常: ${err.message}`, 'error');
        }
      }

      // 渲染書籍資訊
      function renderBook(isbn, info, raw) {
        bookEmpty.style.display = 'none';
        bookContent.style.display = 'flex';

        bTitle.textContent = info.title || '未知書名';
        bIsbn.textContent = `ISBN: ${isbn}`;
        bAuthor.textContent = (info.authors && info.authors.length) ? info.authors.join('、') : '未知';
        bPublisher.textContent = info.publisher || '未知';
        bDate.textContent = info.publishedDate || '未知';
        bPages.textContent = info.pageCount ? `${info.pageCount} 頁` : '未知';
        bCategories.textContent = (info.categories && info.categories.length) ? info.categories.join(' / ') : '未知';

        if (info.imageLinks && (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail)) {
          const imgUrl = (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail).replace(/^http:\/\//, 'https://');
          bThumb.innerHTML = `<img src="${imgUrl}" alt="封面">`;
        } else {
          bThumb.innerHTML = `<i data-lucide="book"></i>`;
        }

        bRawJson.textContent = JSON.stringify(raw, null, 2);
        lucide.createIcons();
      }

      function renderEmptyBook(isbn, raw) {
        bookEmpty.style.display = 'none';
        bookContent.style.display = 'flex';

        bTitle.textContent = `未收錄書籍 (${isbn})`;
        bIsbn.textContent = `ISBN: ${isbn}`;
        bAuthor.textContent = 'Google Books 未提供';
        bPublisher.textContent = 'Google Books 未提供';
        bDate.textContent = '-';
        bPages.textContent = '-';
        bCategories.textContent = '-';
        bThumb.innerHTML = `<i data-lucide="book-x" style="color:var(--warning);"></i>`;
        bRawJson.textContent = JSON.stringify(raw || { message: "totalItems: 0" }, null, 2);
        lucide.createIcons();
      }

      // 相機控制
      async function startCamera() {
        if (isScanning) return;
        log('[相機] 請求相機權限與啟動...', 'info');
        camStatus.textContent = '啟動中...';

        try {
          if (html5QrCode) {
            try {
              if (html5QrCode.isScanning) await html5QrCode.stop();
              await html5QrCode.clear();
            } catch(e) {}
          }

          html5QrCode = new Html5Qrcode('reader', {
            formatsToSupport: [
              Html5QrcodeSupportedFormats.EAN_13,
              Html5QrcodeSupportedFormats.EAN_8
            ],
            verbose: false
          });

          const config = {
            fps: 12,
            qrbox: { width: 280, height: 120 }
          };

          const onScan = (decodedText) => handleBarcode(decodedText);
          const onErr = () => {};

          try {
            // 優先嘗試標準後置鏡頭
            await html5QrCode.start({ facingMode: 'environment' }, config, onScan, onErr);
          } catch(e1) {
            log(`[相機提示] 直接以 facingMode 啟動失敗，嘗試搜尋後置鏡頭 ID...`, 'warn');
            const cameras = await Html5Qrcode.getCameras();
            if (cameras && cameras.length > 0) {
              const backCam = cameras.find(c => /back|rear|environment|後/i.test(c.label)) || cameras[cameras.length - 1];
              await html5QrCode.start(backCam.id, config, onScan, onErr);
            } else {
              throw e1;
            }
          }

          isScanning = true;
          camStatus.textContent = '掃描中 (綠色框線對準條碼)';
          camStatus.style.color = 'var(--success)';
          camPlaceholder.classList.add('hidden');
          btnStart.style.display = 'none';
          btnStop.style.display = 'inline-flex';
          log('[相機] 相機成功啟動！請將條碼置於框線內', 'success');

          // 檢查補光燈
          try {
            const track = html5QrCode.getRunningTrackCapabilities();
            if (track && 'torch' in track) {
              btnTorch.disabled = false;
              log('[相機] 補光燈 (Torch) 支援已啟用', 'info');
            }
          } catch(e) {}

        } catch (err) {
          log(`[相機錯誤] 啟動失敗: ${err.message || err}`, 'error');
          camStatus.textContent = '啟動失敗';
          camStatus.style.color = 'var(--danger)';
        }
      }

      async function stopCamera() {
        if (!isScanning || !html5QrCode) return;
        try {
          await html5QrCode.stop();
          isScanning = false;
          camStatus.textContent = '已暫停';
          camStatus.style.color = 'var(--text-dim)';
          camPlaceholder.classList.remove('hidden');
          btnStart.style.display = 'inline-flex';
          btnStop.style.display = 'none';
          btnTorch.disabled = true;
          log('[相機] 已關閉相機串流', 'info');
        } catch(e) {
          log(`[相機錯誤] 停止相機失敗: ${e.message}`, 'error');
        }
      }

      // 條碼處理 (防抖與格式過濾)
      function handleBarcode(code) {
        if (scanCooldown) return;
        const clean = code.replace(/[^0-9Xx]/g, '').trim();

        // 僅接受 ISBN-10 或 13
        if (clean.length !== 10 && clean.length !== 13) return;

        // 若為 13 碼，通常必須以 978 或 979 開頭
        if (clean.length === 13 && !clean.startsWith('978') && !clean.startsWith('979')) {
          log(`[條碼過濾] 偵測到 ${clean} (非標準 978/979 ISBN，忽略)`, 'warn');
          return;
        }

        scanCooldown = true;
        setTimeout(() => { scanCooldown = false; }, 2200);

        log(`[條碼偵測成功] 讀取到條碼: ${clean}`, 'success');
        inputTestIsbn.value = clean;
        queryGoogleBooks(clean);
      }

      // 事件綁定
      btnStart.addEventListener('click', startCamera);
      btnStop.addEventListener('click', stopCamera);

      btnTorch.addEventListener('click', async () => {
        if (!isScanning || !html5QrCode) return;
        isTorchOn = !isTorchOn;
        try {
          await html5QrCode.applyVideoConstraints({ advanced: [{ torch: isTorchOn }] });
          btnTorch.classList.toggle('btn-primary', isTorchOn);
          log(`[相機] 補光燈已${isTorchOn ? '開啟' : '關閉'}`, 'info');
        } catch(e) {
          log(`[相機] 補光燈切換失敗: ${e.message}`, 'warn');
        }
      });

      btnTestIsbn.addEventListener('click', () => {
        const val = inputTestIsbn.value.trim();
        queryGoogleBooks(val);
      });

      btnSaveKey.addEventListener('click', () => {
        const key = inputApiKey.value.trim();
        if (key) {
          localStorage.setItem('google_books_api_key', key);
          log(`[設定] 已儲存自訂 Google Books API Key (${key.substring(0,6)}...)`, 'success');
        } else {
          localStorage.removeItem('google_books_api_key');
          log(`[設定] 已移除 API Key (切換至預設公開配額模式)`, 'warn');
        }
      });

      btnClearBook.addEventListener('click', () => {
        bookContent.style.display = 'none';
        bookEmpty.style.display = 'block';
        log('[書籍] 已清空畫面顯示', 'info');
      });

      document.getElementById('btn-clear-log').addEventListener('click', () => {
        t.innerHTML = '';
        log('Log 已清空', 'info');
      });

      document.getElementById('btn-copy-log').addEventListener('click', () => {
        const text = t.innerText;
        navigator.clipboard.writeText(text).then(() => {
          alert('Log 已複製至剪貼簿！');
        });
      });

      lucide.createIcons();
    })();
  </script>
</body>
</html>
